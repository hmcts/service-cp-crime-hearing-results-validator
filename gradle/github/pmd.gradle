apply plugin: 'pmd'

pmd {
  ruleSets = []
  ruleSetFiles = files(".github/pmd-ruleset.xml")
  ignoreFailures = false
  toolVersion = "7.29.0"
}

// src/test and src/apiTest get the test ruleset -- same base, minus rules that are inapplicable
// to test code or false-positive against this project's test conventions (see the ruleset file).
tasks.named("pmdTest").configure {
  ruleSetFiles = files(".github/pmd-test-ruleset.xml")
}

tasks.withType(Pmd) {
  reports {
    xml.required.set(true)
    html.required.set(true)
  }
}

