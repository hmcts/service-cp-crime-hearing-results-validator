rule:
  id: "DR-APP-009"
  title: "Application result recorded against an offence"
  description: >-
    Blocks sharing when a result that is only valid against an application (e.g. Legal Aid
    Withdrawn, Application Refused) is recorded against an offence instead.
  priority: 9000
  enabled: true

  preprocessing:
    type: "application-result-offence"
    applicationOnlyShortCodes:
      - ARBSFG   # Application to record and broadcast sentencing remarks – formally granted
      - ARBSPG   # Application to record and broadcast sentencing remarks – provisionally granted
      - ARBSR    # Application to record and broadcast sentencing remarks – refused
      - VT       # Application to vacate granted
      - G        # Granted
      - LAREP    # Legal Aid Representation Varied
      - LAREPCC  # Legal Aid Representation Varied (Crown Court)
      - ORDC     # Order (made upon application)
      - LATG     # Legal Aid Transfer Granted
      - LATR     # Legal Aid Transfer Refused
      - LAWD     # Legal Aid Withdrawn
      - RFSD     # Application refused
      - SMAR     # Special Measures Refused

  # The conditions differ only in singular/plural wording. Exactly one fires per offence:
  # globalResultLabelCount (the page-level wording) is hearing-wide and identical on every context,
  # and offenceResultLabelCount (the inline wording) can only exceed 1 when the global count does.
  conditions:
    - id: "AC1"
      name: "Application-only result recorded against an offence"
      expression: "hasBreach == 1 && globalResultLabelCount <= 1"
      severity: ERROR
      messageTemplate: >-
        Remove ${resultLabel} from this offence. It is an application result, so it can only be
        added to an application.
      errorMessageTemplate: >-
        ${resultLabel} is an application result. It cannot be added to an offence. Remove it
        from the offence and add an application to the hearing. This affects: ${defendantNames}.
      affectedOffenceSet: "breachOffenceId"
      affectedDefendantSet: "defendantId"
      calculatedValueSet: "resultLabelByOffenceId"
      calculatedValuePlaceholderName: "resultLabel"
      consolidatePageLevelError: true
      validationLevel: OFFENCE

    - id: "AC2B"
      name: "Application-only results recorded against multiple offences"
      expression: "hasBreach == 1 && globalResultLabelCount > 1 && offenceResultLabelCount <= 1"
      severity: ERROR
      messageTemplate: >-
        Remove ${resultLabel} from this offence. It is an application result, so it can only be
        added to an application.
      errorMessageTemplate: >-
        ${resultLabel} are application results. They cannot be added to an offence. Remove them
        from the offence and add an application to the hearing. This affects: ${defendantNames}.
      affectedOffenceSet: "breachOffenceId"
      affectedDefendantSet: "defendantId"
      calculatedValueSet: "resultLabelByOffenceId"
      calculatedValuePlaceholderName: "resultLabel"
      consolidatePageLevelError: true
      validationLevel: OFFENCE

    - id: "AC2A"
      name: "Multiple application-only results recorded against the same offence"
      expression: "hasBreach == 1 && globalResultLabelCount > 1 && offenceResultLabelCount > 1"
      severity: ERROR
      messageTemplate: >-
        Remove ${resultLabel} from this offence. They are application results, so they can only
        be added to an application.
      errorMessageTemplate: >-
        ${resultLabel} are application results. They cannot be added to an offence. Remove them
        from the offence and add an application to the hearing. This affects: ${defendantNames}.
      affectedOffenceSet: "breachOffenceId"
      affectedDefendantSet: "defendantId"
      calculatedValueSet: "resultLabelByOffenceId"
      calculatedValuePlaceholderName: "resultLabel"
      consolidatePageLevelError: true
      validationLevel: OFFENCE
